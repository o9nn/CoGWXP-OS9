name: CI — Build & Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least-privilege default: all jobs read-only unless overridden
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build matrix: Linux (primary) + macOS, Debug + Release
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
        build_type: [Debug, Release]
        include:
          # Enable extra sanitizers only on Linux Debug for speed
          - os: ubuntu-22.04
            build_type: Debug
            sanitizers: "-DENABLE_ASAN=ON -DENABLE_UBSAN=ON"
          - os: ubuntu-22.04
            build_type: Release
            sanitizers: ""
          - os: ubuntu-24.04
            build_type: Debug
            sanitizers: ""
          - os: ubuntu-24.04
            build_type: Release
            sanitizers: ""
          - os: macos-14
            build_type: Debug
            sanitizers: ""
          - os: macos-14
            build_type: Release
            sanitizers: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Dependency installation
      # -----------------------------------------------------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            build-essential \
            libboost-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            valgrind \
            lcov \
            python3 \
            python3-pip

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update --quiet
          brew install cmake ninja boost openssl curl lcov || true

      # -----------------------------------------------------------------------
      # Configure
      # -----------------------------------------------------------------------
      - name: Configure CMake
        run: |
          cmake -B build -S cogwxp \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTS=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_9P_INTEGRATION=ON \
            -DENABLE_DIS_INTEGRATION=ON \
            -DENABLE_NT_INTEGRATION=OFF \
            -DENABLE_SSL=OFF \
            ${{ matrix.sanitizers || '' }}

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Build
        run: cmake --build build --parallel

      # -----------------------------------------------------------------------
      # Unit tests
      # -----------------------------------------------------------------------
      - name: Run unit tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure \
            --timeout 120 \
            -L unit \
            --no-compress-output \
            -T Test

      - name: Run integration tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure \
            --timeout 300 \
            -L integration \
            --no-compress-output \
            -T Test
        continue-on-error: false

      # -----------------------------------------------------------------------
      # Upload CTest XML results
      # -----------------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/Testing/**/*.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Code coverage (Linux Debug only)
  # ---------------------------------------------------------------------------
  coverage:
    name: Code Coverage
    runs-on: ubuntu-22.04
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libboost-program-options-dev lcov

      - name: Configure with coverage
        run: |
          cmake -B build -S cogwxp \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_9P_INTEGRATION=ON \
            -DENABLE_DIS_INTEGRATION=ON \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --parallel

      - name: Run all tests
        run: ctest --test-dir build --output-on-failure --timeout 300
        continue-on-error: true

      - name: Collect coverage
        run: |
          lcov \
            --capture \
            --directory build \
            --output-file coverage.info \
            --ignore-errors mismatch,source \
            --rc lcov_branch_coverage=1
          lcov \
            --remove coverage.info \
            '/usr/*' \
            '*/tests/*' \
            --output-file coverage_filtered.info \
            --rc lcov_branch_coverage=1 || true
          lcov --list coverage_filtered.info || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_filtered.info
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Static analysis
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            cppcheck clang-tidy

      - name: Configure
        run: |
          cmake -B build -S cogwxp \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run cppcheck
        run: |
          cppcheck \
            --project=build/compile_commands.json \
            --enable=all \
            --error-exitcode=0 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --quiet \
            2>&1 | tee cppcheck-report.txt || true
          echo "Cppcheck complete."

      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: cppcheck-report.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Memory check with Valgrind (Linux Debug)
  # ---------------------------------------------------------------------------
  memcheck:
    name: Memory Check (Valgrind)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            valgrind

      - name: Configure
        run: |
          cmake -B build -S cogwxp \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_9P_INTEGRATION=ON \
            -DENABLE_DIS_INTEGRATION=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests under Valgrind
        run: |
          ctest \
            --test-dir build \
            --output-on-failure \
            --timeout 600 \
            --overwrite MemoryCheckCommandOptions="--leak-check=full --error-exitcode=1 --suppressions=/usr/lib/valgrind/debian.supp" \
            -T MemCheck
        continue-on-error: true

      - name: Upload memcheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memcheck-results
          path: build/Testing/Temporary/MemoryChecker.*.log
          retention-days: 30
